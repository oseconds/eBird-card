name: Generate eBird Bird Ranking Cards

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'eBird Data Download URL'
        required: true
        type: string

jobs:
  generate-ranking:
    name: Generate Frequency and Abundance Rankings
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests cairosvg

      - name: Run ranking generation script
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          EBIRD_ZIP_URL: ${{ github.event.inputs.zip_url }}
        run: |
          python src/ebird_readme_card/freq-bird-ranking.py --zip-url "$EBIRD_ZIP_URL" --mode frequency --output "assets/freq-ranking.svg"
          python src/ebird_readme_card/freq-bird-ranking.py --zip-url "$EBIRD_ZIP_URL" --mode abundance --output "assets/abundance-ranking.svg"

      - name: Commit and push changes
        if: ${{ env.LOCAL_ACT != 'true' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "update frequency and abundance ranking cards"
          file_pattern: "assets/freq-ranking.svg assets/abundance-ranking.svg"
