name: Generate eBird card

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'eBird ZIP Download URL'
        required: true
        type: string
      location_mode:
        description: 'Select Location Display Mode'
        required: true
        default: 'location'
        type: choice
        options:
          - location
          - state
          - country
          - none
      card_title:
        description: 'Custom Card Title (Leave blank for default)'
        required: false
        type: string
        default: ''
      output_format:
        description: 'Card Output Format'
        required: true
        default: 'svg'
        type: choice
        options:
          - svg
          - png
          - both

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies (for PNG rendering)
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev
          
      - name: Install Python dependencies
        run: pip install pandas requests cairosvg

      - name: Run Python script
        run: python src/ebird_readme_card/generate-card.py
        env:
          ZIP_URL: ${{ github.event.inputs.zip_url }}
          LOCATION_MODE: ${{ github.event.inputs.location_mode }}
          CARD_TITLE: ${{ github.event.inputs.card_title }}
          OUTPUT_FORMAT: ${{ github.event.inputs.output_format }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Commit eBird card files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ebird-card.svg ebird-card.png || true
          git commit -m "Update eBird stats card (SVG/PNG)" || exit 0
          git push
