name: Generate eBird New Lifer Card

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'eBird Data Download URL'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests cairosvg

      - name: Run New Lifer script
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python src/ebird_readme_card/new-lifer.py --zip-url "${{ github.event.inputs.zip_url }}" --output "assets/new-lifer.svg"

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "update new-lifer card"
          file_pattern: "assets/new-lifer.svg"
