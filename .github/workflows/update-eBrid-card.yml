name: Update README cards

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'eBird ZIP Download URL'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    
    env:
      OUTPUT_PATH: "ebird-card.svg" 

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install pandas requests

      - name: Run Python script
        run: python src/ebird_readme_card/generate-card.py
        env:
          ZIP_URL: ${{ github.event.inputs.zip_url }}
          

      - name: Commit eBird card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_PATH"
          git commit -m "Update eBird stats card" || exit 0
          git push
