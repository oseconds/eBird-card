name: Update eBird Card

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'eBird ZIP Download URL'
        required: true
        type: string

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install pandas requests # 필요한 라이브러리 설치
          
      - name: Run Python script
        run: python src/ebird_readme_card/generate-card.py
        env:
          ZIP_URL: ${{ github.event.inputs.zip_url }} # 입력받은 링크를 환경변수로 

      - name: Commit and push generated card
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: assets/ebird-card.svg
          commit_message: "🎨 Update eBird stats card [skip ci]"
