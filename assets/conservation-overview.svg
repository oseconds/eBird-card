  <text x="30" y="216" class="label" fill="#a3be4a">NT</text><rect x="103" y="206" width="222" height="13" rx="5" fill="#21262d"/><rect x="103" y="206" width="0.00" height="13" rx="5" fill="#a3be4a"><title>NT: 0 taxa (0.0%)</title></rect><text x="340" y="216" class="count">0</text><text x="414" y="216" class="percent">0%</text>
  <text x="30" y="246" class="label" fill="#3fb950">LC</text><rect x="103" y="236" width="222" height="13" rx="5" fill="#21262d"/><rect x="103" y="236" width="176.78" height="13" rx="5" fill="#3fb950"><title>LC: 43 taxa (79.6%)</title></rect><text x="340" y="246" class="count">43</text><text x="414" y="246" class="percent">80%</text>
